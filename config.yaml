# ChArUco Board Configuration
charuco:
  # ArUcoマーカー辞書タイプ (DICT_4X4_50, DICT_5X5_100, etc.)
  dictionary: "DICT_5X5_100"

  # チェスボードのマス数 (幅x高さ)
  squares_x: 7
  squares_y: 7

  # 1マスのサイズ (メートル単位)
  square_length: 0.03  

  # ArUcoマーカーのサイズ (メートル単位)
  marker_length: 0.022 

# カメラ設定
camera:
  # カメラデバイスID
  device_id: 0

  # 解像度
  width: 1280
  height: 720

  # FPS
  fps: 30

# キャリブレーション設定
calibration:
  # キャリブレーション結果の保存先
  save_path: "calibration_params.yaml"

  # キャリブレーションに必要な最小フレーム数
  min_frames: 30

# トラッキング設定
tracking:
  # トラッキング処理のFPS（データ記録頻度）
  # カメラのFPSとは独立して、何fpsでポーズをトラッキングするかを指定
  # 例: 30 = 毎フレーム記録, 10 = 0.1秒ごとに記録, 1 = 1秒ごとに記録
  tracking_fps: 10

  # 連続トラッキング結果の保存先デフォルト
  default_save_path: "trajectory.yaml"

  # スポット測定結果の保存先デフォルト
  spot_save_path: "spot_measurement.yaml"

# display settings
display:
  enabled: true
